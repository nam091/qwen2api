root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/qwen2api"
  bin = "tmp\\main.exe"
  delay = 1000
  exclude_dir = ["tmp", "node_modules", "scripts", "docs"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "json"]
  kill_delay = "2s"

[misc]
  clean_on_exit = true
